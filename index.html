<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравление с 8 марта</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #greeting {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        #greeting img {
            max-width: 100%;
            height: auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <button id="showGreeting">Далее</button>

    <div id="greeting">
        <h1>С 8 Марта!</h1>
        <img src="https://i.pinimg.com/736x/e9/4b/f5/e94bf5c4289008dca7eeb0003c9dd1d9.jpg" alt="Праздничное изображение">
        <button onclick="closeGreeting()">Закрыть</button>
    </div>

    <script>
        const showGreetingButton = document.getElementById('showGreeting');
        const greetingDiv = document.getElementById('greeting');

        showGreetingButton.onclick = function() {
            greetingDiv.style.display = 'flex';
        };

        function closeGreeting() {
            greetingDiv.style.display = 'none';
        }
    </script>

</body>
</html>
